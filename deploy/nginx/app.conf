# Brand dashboard (cpa-hub) — TanStack Start SSR app, proxied to the Node process on :3000
# Served at app.lightb.tech, behind Cloudflare (Flexible SSL — Cloudflare terminates HTTPS for
# visitors and talks to this origin over plain HTTP, so no cert is needed on the VPS).
#
#   sudo cp deploy/nginx/app.conf /etc/nginx/sites-available/app.conf
#   sudo ln -s /etc/nginx/sites-available/app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires deploy/DEPLOYMENT.md steps 1 (DNS record) and 4 (real-IP restoration) done first,
# and Cloudflare SSL/TLS mode set to Flexible.

server {
    listen 80;
    listen [::]:80;
    server_name app.lightb.tech;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Backend REST API + Telegram webhook (Express) — proxied to the Node process on :5000
# Served at api.lightb.tech, behind Cloudflare (Flexible SSL — Cloudflare terminates HTTPS for
# visitors and talks to this origin over plain HTTP, so no cert is needed on the VPS).
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/api.conf
#   sudo ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires deploy/DEPLOYMENT.md steps 1 (DNS record) and 4 (real-IP restoration) done first,
# and Cloudflare SSL/TLS mode set to Flexible.

server {
    listen 80;
    listen [::]:80;
    server_name api.lightb.tech;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

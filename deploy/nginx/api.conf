# Backend REST API + Telegram webhook (Express) — proxied to the Node process on :5000
# Served at api.lightb.tech, behind Cloudflare (Full strict + Origin CA cert).
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/api.conf
#   sudo ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requires deploy/cloudflare-setup.md steps 1-4 done first (DNS record, Origin CA cert at
# /etc/ssl/cloudflare/lightb.tech.{pem,key}, real-IP restoration installed).

server {
    listen 80;
    listen [::]:80;
    server_name api.lightb.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.lightb.tech;

    ssl_certificate     /etc/ssl/cloudflare/lightb.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/lightb.tech.key;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Backend REST API + Telegram webhook (Express) — proxied to the Node process on :5000
# Served at api.lightb.tech, behind Cloudflare. HTTPS on the origin is a Let's Encrypt cert
# obtained via Certbot (shared SAN cert covering app/api/ad.lightb.tech, filed under the
# app.lightb.tech lineage name since it was the first -d domain requested).
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/api.conf
#   sudo ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# First-time setup: after copying this + app.conf + ad.conf into sites-available/enabled with
# plain port-80 blocks, run:
#   sudo certbot --nginx -d app.lightb.tech -d api.lightb.tech -d ad.lightb.tech
# which obtains the cert and rewrites these files in place to match what's below. Do NOT
# `cp` this file back over the server's copy after that — it would remove the cert config
# Certbot added. This file mirrors the server's post-Certbot state for reference/DR only.

server {
    server_name api.lightb.tech;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.lightb.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.lightb.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = api.lightb.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.lightb.tech;
    return 404; # managed by Certbot


}

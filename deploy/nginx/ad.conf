# Admin dashboard — static build served directly by Nginx (no Node process needed)
# Served at ad.lightb.tech, behind Cloudflare. HTTPS on the origin is a Let's Encrypt cert
# obtained via Certbot (shared SAN cert covering app/api/ad.lightb.tech, filed under the
# app.lightb.tech lineage name since it was the first -d domain requested).
#
#   sudo cp deploy/nginx/ad.conf /etc/nginx/sites-available/ad.conf
#   sudo ln -s /etc/nginx/sites-available/ad.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# First-time setup: after copying this + app.conf + api.conf into sites-available/enabled with
# plain port-80 blocks, run:
#   sudo certbot --nginx -d app.lightb.tech -d api.lightb.tech -d ad.lightb.tech
# which obtains the cert and rewrites these files in place to match what's below. Do NOT
# `cp` this file back over the server's copy after that — it would remove the cert config
# Certbot added. This file mirrors the server's post-Certbot state for reference/DR only.
#
# This manages real money (can pause any merchant's campaigns) and its only gate is its own
# login. Consider adding a second layer here — e.g. Cloudflare Access in front of this
# hostname, or an `allow`/`deny` IP allowlist below — before handing out admin accounts.

server {
    server_name ad.lightb.tech;

    root /var/www/cpa-hub-admin;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.lightb.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.lightb.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ad.lightb.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ad.lightb.tech;
    return 404; # managed by Certbot


}

# Admin dashboard — static build served directly by Nginx (no Node process needed)
# Served at ad.lightb.tech, behind Cloudflare (Flexible SSL — Cloudflare terminates HTTPS for
# visitors and talks to this origin over plain HTTP, so no cert is needed on the VPS).
#
#   sudo cp deploy/nginx/ad.conf /etc/nginx/sites-available/ad.conf
#   sudo ln -s /etc/nginx/sites-available/ad.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This manages real money (can pause any merchant's campaigns) and its only gate is its own
# login. Consider adding a second layer here — e.g. Cloudflare Access in front of this
# hostname, or an `allow`/`deny` IP allowlist below — before handing out admin accounts.

server {
    listen 80;
    listen [::]:80;
    server_name ad.lightb.tech;

    root /var/www/cpa-hub-admin;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
